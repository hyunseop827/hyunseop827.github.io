<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 김현섭</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg: #f7f7f5; --fg: #1b1d20; --muted: #5f6368; --accent: #2a57c0; --line: #dcdcd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1113; --fg: #e8e9ea; --muted: #9aa0a6; --accent: #7ea2ee; --line: #2b2f33; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.6; }
  main { max-width: 420px; }
  .code { color: var(--accent); font-weight: 700; letter-spacing: .04em; }
  h1 { margin: 4px 0 8px; font-size: 1.5rem; }
  p { margin: 0 0 20px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  a { display: inline-block; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--fg); text-decoration: none; }
  a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main [lang=en] { display: none; }
  html.en main [lang=ko] { display: none; }
  html.en main [lang=en] { display: block; }
  html.en main .links [lang=en] { display: inline-block; }
</style>
<script>
  (function () {
    var lang = null;
    try { lang = localStorage.getItem('hk-lang'); } catch (e) { /* ignore */ }
    if (!lang) lang = /^ko/i.test(navigator.language || '') ? 'ko' : 'en';
    if (lang === 'en') { document.documentElement.classList.add('en'); document.documentElement.lang = 'en'; document.title = 'Page not found | Hyunseop Kim'; }
  })();
</script>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1 lang="ko">페이지를 찾을 수 없습니다</h1>
  <h1 lang="en">Page not found</h1>
  <p lang="ko">주소가 바뀌었거나 없는 페이지입니다. 홈이나 프로젝트 목록에서 다시 찾아 주세요.</p>
  <p lang="en">The page may have moved or never existed. Try the home page or the project list.</p>
  <div class="links">
    <a class="primary" href="/" lang="ko">홈으로</a><a class="primary" href="/" lang="en">Home</a>
    <a href="/projects.html" lang="ko">프로젝트 보기</a><a href="/projects.html" lang="en">Projects</a>
  </div>
</main>
</body>
</html>
