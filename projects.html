<script>
  /* Apply design, theme and language before first paint (no flash).
     URL overrides: ?design= &theme= &lang= */
  (function () {
    var d = document.documentElement, c = window.SITE_CONFIG || {}, q = {};
    location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { try { q[k] = decodeURIComponent(v); } catch (e) { /* ignore malformed params */ } });
    function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    var designs = { classic: 1, terminal: 1, editorial: 1 };
    var design = q.design || (c.designPicker ? get('hk-design') : null) || c.design;
    if (!designs[design]) design = 'classic';
    var theme = q.theme || get('hk-theme');
    if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var lang = q.lang || get('hk-lang');
    d.setAttribute('data-design', design);
    d.setAttribute('data-theme', theme);
    d.lang = lang === 'en' ? 'en' : 'ko';
    d.classList.add('is-booting');
    setTimeout(function () { d.classList.remove('is-booting'); }, 4000); // safety net if site.js fails
    // classic.css is linked above; other drafts (css/designs/*.css) load only when chosen.
    var font = (c.fonts || {})[design];
    if (design !== 'classic') document.write('<link rel="stylesheet" href="css/designs/' + design + '.css">' +
      (font ? '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="' + font + '" media="print" onload="this.media=\'all\'">' : ''));
  })();
</script>
